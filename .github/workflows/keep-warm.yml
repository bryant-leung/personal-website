name: keep-warm

on:
  schedule:
    - cron: "0 * * * *" # hourly, UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL repo variable not set"; exit 1; }
          curl -fsS -o /dev/null --retry 2 --max-time 20 \
            -w "HTTP %{http_code} in %{time_total}s\n" "$SITE_URL"
